server.port=8085

# Spring MVC & File Upload Limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Database Configuration (MySQL 8.4)
spring.datasource.url=jdbc:mysql://localhost:3306/resume_analyzer?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Externalized AI & Gemini Configuration
gemini.api.key=${GEMINI_API_KEY:${GOOGLE_API_KEY:your_gemini_api_key_here}}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# Job Search APIs
remotive.api.url=https://remotive.com/api/remote-jobs

# Security Session Timeout (8 Hours = 28800 seconds)
server.servlet.session.timeout=28800s
