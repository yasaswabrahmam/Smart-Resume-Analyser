<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::#main-content})}">
<head>
    <title>Create Account - Smart AI Resume Analyzer</title>
</head>
<body>
    <div id="main-content">
        <div class="row justify-content-center my-4">
            <div class="col-md-7 col-lg-5" style="max-width: 440px;">
                <div class="custom-card p-4 p-md-5">
                    <!-- Icon & Heading -->
                    <div class="text-center mb-4">
                        <div th:replace="~{fragments/brand :: brandIcon('brand-icon-md mx-auto mb-3')}"></div>
                        <h3 class="fw-bold mb-1">Create Account</h3>
                        <p class="text-muted small mb-0">Join <span class="brand-title-gradient">Smart Resume AI</span> to optimize your career</p>
                    </div>

                    <form th:action="@{/register}" th:object="${userDto}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent text-muted" style="border-color: var(--border-subtle);"><i class="fa-solid fa-user"></i></span>
                                <input type="text" th:field="*{fullName}" class="form-control" placeholder="Yasaswa Brahmam" required>
                            </div>
                            <div th:if="${#fields.hasErrors('fullName')}" class="text-danger small mt-1" th:errors="*{fullName}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent text-muted" style="border-color: var(--border-subtle);"><i class="fa-solid fa-envelope"></i></span>
                                <input type="email" th:field="*{email}" class="form-control" placeholder="name@example.com" required>
                            </div>
                            <div th:if="${#fields.hasErrors('email')}" class="text-danger small mt-1" th:errors="*{email}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent text-muted" style="border-color: var(--border-subtle);"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" th:field="*{password}" class="form-control" placeholder="••••••••" required>
                            </div>
                            <div th:if="${#fields.hasErrors('password')}" class="text-danger small mt-1" th:errors="*{password}"></div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent text-muted" style="border-color: var(--border-subtle);"><i class="fa-solid fa-circle-check"></i></span>
                                <input type="password" th:field="*{confirmPassword}" class="form-control" placeholder="••••••••" required>
                            </div>
                            <div th:if="${#fields.hasErrors('confirmPassword')}" class="text-danger small mt-1" th:errors="*{confirmPassword}"></div>
                        </div>

                        <button type="submit" class="btn btn-primary-custom w-100 py-2 fs-6">
                            <i class="fa-solid fa-user-check"></i>
                            <span>Register Account</span>
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-3" style="border-top: 1px solid var(--border-subtle);">
                        <span class="text-muted small">Already registered?</span>
                        <a th:href="@{/login}" class="text-success small fw-semibold ms-1">Sign In</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
