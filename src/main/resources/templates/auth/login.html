<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::#main-content})}">
<head>
    <title>Sign In - Smart AI Resume Analyzer</title>
</head>
<body>
    <div id="main-content">
        <div class="row justify-content-center my-4">
            <div class="col-md-7 col-lg-5" style="max-width: 440px;">
                <div class="custom-card p-4 p-md-5">
                    <!-- Icon & Heading -->
                    <div class="text-center mb-4">
                        <div th:replace="~{fragments/brand :: brandIcon('brand-icon-md mx-auto mb-3')}"></div>
                        <h3 class="fw-bold mb-1">Welcome Back</h3>
                        <p class="text-muted small mb-0">Sign in to your <span class="brand-title-gradient">Smart Resume AI</span> account</p>
                    </div>

                    <!-- Interactive Demonstration Credentials Box -->
                    <div class="p-3 rounded-2 mb-4" style="background: rgba(16, 185, 129, 0.06); border: 1px solid rgba(16, 185, 129, 0.25);">
                        <div class="d-flex align-items-center justify-content-between mb-2">
                            <span class="small fw-semibold text-success d-flex align-items-center gap-1">
                                <i class="fa-solid fa-key"></i> Demo Credentials
                            </span>
                            <span class="text-dim" style="font-size: 0.7rem;">Click to Auto-fill</span>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-sm btn-secondary-custom flex-grow-1 py-1 text-truncate" style="font-size: 0.75rem;" onclick="fillDemo('admin@smartresume.com', 'admin123')">
                                <i class="fa-solid fa-shield-halved text-warning me-1"></i> Admin
                            </button>
                            <button type="button" class="btn btn-sm btn-secondary-custom flex-grow-1 py-1 text-truncate" style="font-size: 0.75rem;" onclick="fillDemo('user@smartresume.com', 'user123')">
                                <i class="fa-solid fa-user text-primary me-1"></i> User
                            </button>
                        </div>
                    </div>

                    <!-- Login Form -->
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent text-muted" style="border-color: var(--border-subtle);"><i class="fa-solid fa-envelope"></i></span>
                                <input type="email" id="loginUsername" name="username" class="form-control" placeholder="name@example.com" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent text-muted" style="border-color: var(--border-subtle);"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" id="loginPassword" name="password" class="form-control" placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary-custom w-100 py-2 fs-6">
                            <i class="fa-solid fa-right-to-bracket"></i>
                            <span>Sign In to Account</span>
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-3" style="border-top: 1px solid var(--border-subtle);">
                        <span class="text-muted small">Don't have an account?</span>
                        <a th:href="@{/register}" class="text-success small fw-semibold ms-1">Create Account</a>
                    </div>
                </div>
            </div>
        </div>

        <script>
            function fillDemo(email, pass) {
                document.getElementById('loginUsername').value = email;
                document.getElementById('loginPassword').value = pass;
            }
        </script>
    </div>
</body>
</html>
